    <path d="M46,66 C50,68 54,70 57,74 C55,79 52,83 47,86 C44,80 44,72 46,66 Z" fill="#5B9CFF"/>
  </g>

  <path d="M27,58 L38,60 L18,86 L12,84 Z" fill="url(#leftOuter)"/>
  <path d="M50,18 L57,20 L38,60 L27,58 Z" fill="url(#leftInner)"/>
  <path d="M50,18 L84,86 L64,86 L43,20 Z" fill="url(#right)"/>
  <path d="M46,66 C50,68 54,70 57,74 C55,79 52,83 47,86 C44,80 44,72 46,66 Z" fill="url(#swoosh)"/>

  <path
