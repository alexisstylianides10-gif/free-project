<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080a14"/>
      <stop offset="1" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="right" x1="50" y1="18" x2="74" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCF3FF"/>
      <stop offset="0.35" stop-color="#4FA8FF"/>
      <stop offset="1" stop-color="#1E4FD0"/>
    </linearGradient>
    <linearGradient id="leftInner" x1="50" y1="18" x2="38" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8E8FF"/>
      <stop offset="0.55" stop-color="#5B8CFF"/>
