    <linearGradient id="leftOuter" x1="30" y1="30" x2="18" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141B33"/>
      <stop offset="1" stop-color="#05060B"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="46" y1="66" x2="58" y2="86" gradientUnits="userSpaceOnUse">
